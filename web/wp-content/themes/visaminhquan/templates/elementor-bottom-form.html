<!-- Section: Bottom Form - Contact Form 7 -->
<!-- Sử dụng widget HTML trong Elementor và paste code này vào -->
<!-- Sau đó tạo Contact Form 7 với ID tương ứng và thay thế shortcode -->
<div class="vmq-bottom-form">
    <div class="vmq-bottom-form-wrap">
        [contact-form-7 id="YOUR_FORM_ID" title="Bottom Form"]
    </div>
</div>

<!-- 
═══════════════════════════════════════════════════════════════
HƯỚNG DẪN TẠO CONTACT FORM 7:
═══════════════════════════════════════════════════════════════

1. Vào WordPress Admin > Contact > Contact Forms
2. Click "Add New" để tạo form mới
3. Đặt tên form: "Bottom Form"
4. Copy code sau vào tab "Form":

───────────────────────────────────────────────────────────────
<label> Họ và tên
    [text* your-name placeholder "Họ và tên"] </label>

<label> Địa chỉ Email
    [email* your-email placeholder "Địa chỉ Email"] </label>

<label> Số điện thoại
    [tel* your-phone placeholder "Số điện thoại"] </label>

<label> Yêu cầu của bạn
    [text* your-request placeholder "Yêu cầu của bạn"] </label>

<label> Để lại lời nhắn của bạn
    [textarea your-message placeholder "Để lại lời nhắn của bạn"] </label>

[submit "Gửi yêu cầu"]
───────────────────────────────────────────────────────────────

5. Vào tab "Mail" và cấu hình email nhận thông tin
6. Lưu form và copy Form ID (số ID hiển thị bên cạnh tên form)
7. Thay thế "YOUR_FORM_ID" trong shortcode trên bằng Form ID vừa copy

Ví dụ: [contact-form-7 id="123" title="Bottom Form"]

═══════════════════════════════════════════════════════════════
-->
